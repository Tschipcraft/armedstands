loomx.loom_version="1.16-SNAPSHOT"

mod.id = "armedstands"
mod.name = "Armed Stands"
mod.group = "net.tschipcraft"
mod.version = "1.1"
mod.channel_tag = ""
mod.description = "Gives all armor stands arms by default. The arms can be toggled individually by shift-right-clicking an armor stand."
mod.authors = ["Tschipcraft"]
mod.contributors = ["Fyoncle"]
mod.inception_year = "2026"
mod.license.name = "Custom"
mod.license.url = "https://github.com/Tschipcraft/armedstands/blob/main/LICENSE"
mod.license.dist = "repo"
mod.sources_url = "https://github.com/Tschipcraft/armedstands"
mod.homepage_url = "https://modrinth.com/project/9qYoL1rO"
mod.issues_url = "https://github.com/Tschipcraft/armedstands/issues"
mod.environment = "both"   #"client", "server", "both"
# The mod's logic is server-side; the client half is only the armor stand item texture and lang
# file. So it stays `environment = "both"`, but Forge/NeoForge must not refuse a connection when
# the client does not have it.
mod.forge_display_test = "IGNORE_SERVER_VERSION"
mod.icon = "icon.png"
# Points Forge/NeoForge update checks at the Modrinth API.
mod.modrinth_id = "9qYoL1rO"

# Extra links in the Mod Menu mod entry.
[mod.links]
"modmenu.donate" = "https://ko-fi.com/tschipcraft"
"modmenu.modrinth" = "https://modrinth.com/mod/9qYoL1rO"
"modmenu.curseforge" = "https://www.curseforge.com/minecraft/mc-mods/armed-stands"
"modmenu.youtube" = "https://www.youtube.com/@tschipcraft"

[[mod.pom.developers]]
id = "tschipcraft"
name = "Tschipcraft"
url = "https://github.com/Tschipcraft"

[fabric]
# Armed Stands works with any loader and API version that ships the entrypoints it uses.
deps.fabric_api_range = "*"
deps.fabric_loader_range = "*"
deps.fabric-loader = "0.19.2"

[fabric."1.19.2"]
deps.minecraft = "1.19.2"
deps.minecraft_range_lower = "1.19.2"
deps.minecraft_range_upper = "1.19.4"
deps.fabric-api = "0.60.0+1.19.2"
deps.modmenu = "4.0.6"
publish.additionalVersions = ["1.19.3", "1.19.4"]

[fabric."1.20.1"]
deps.minecraft = "1.20.1"
deps.minecraft_range_lower = "1.20"
deps.minecraft_range_upper = "1.21.1"
deps.fabric-api = "0.88.1+1.20.1"
deps.modmenu = "7.0.1"
publish.additionalVersions = [
	"1.20", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6", "1.21", "1.21.1"
]

