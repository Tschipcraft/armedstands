modLoader = "javafml"
loaderVersion = "[2,)"
license = "${license}"
issueTrackerURL = "${issues_url}"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
displayURL = "${homepage_url}"
modUrl = "${homepage_url}"
updateJSONURL = "https://api.modrinth.com/updates/${modrinth_id}/forge_updates.json?neoforge=only"
logoFile = "icon.png"
logoBlur = false
authors = "${authors}"
credits = "${contributors}"

description = '''${description}'''

[[mixins]]
config = "${id}.mixins.json"

[modproperties.${id}]
catalogueImageIcon="icon.png"
${dependencies}
